name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare production HTML
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          html = html.replace(
              '<meta name="theme-color" content="#0a0a1a">',
              '<meta name="theme-color" content="#0c0906">'
          )

          base_css = '<link rel="stylesheet" href="styles.css?v=20260821-1">'
          production_css = '\n'.join([
              '<link rel="stylesheet" href="gold-theme.css?v=20260821-2">',
              '<link rel="stylesheet" href="gold-consistency.css?v=20260821-4">',
              '<link rel="stylesheet" href="gold-glow.css?v=20260821-1">',
              '<link rel="stylesheet" href="layout-fix.css?v=20260821-3">',
              '<link rel="stylesheet" href="study-nav.css?v=20260821-1">',
              '<link rel="stylesheet" href="study-nav-layout-fix.css?v=20260821-1">',
          ])
          if 'study-nav-layout-fix.css?v=20260821-1' not in html:
              html = html.replace(base_css, base_css + '\n' + production_css)

          html = html.replace(
              '<script src="app.js?v=20260821-1"></script>',
              '<script src="app.js?v=20260821-3"></script>'
          )

          nav_script = '<script src="study-nav.js?v=20260821-1"></script>'
          if nav_script not in html:
              html = html.replace('</body>', nav_script + '\n</body>')

          path.write_text(html, encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
